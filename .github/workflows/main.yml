name: CI DevOps 2025

on:
  push:
  # Lancer lorsque on a un push sur le main ou un PR
    branches:
      - main
  pull_request:

# La liste des jobs à exécuter
jobs:
  # Le nom de notre premier job : tester le backend
  test-backend:
    # La machine virtuelle sur laquelle ce job va s'exécuter.
    runs-on: ubuntu-24.04

    # La liste des étapes à exécuter séquentiellement
    steps:
      # Étape 1 : Récupérer le code de votre dépôt
      - name: Checkout code
        uses: actions/checkout@v4

      # Étape 2 : Mettre en place l'environnement Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Étape 3 : Lancer la commande Maven pour compiler et tester
      - name: Build, test and analyze with Maven
        env:
          # On rend les secrets disponibles comme variables d'environnement pour cette étape
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Secret spécial fourni par GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # La commande Maven est maintenant plus longue
        run: >
          mvn -B verify sonar:sonar
          -Dsonar.projectKey=SebDors_TP_docker
          -Dsonar.organization=sebdors
          -Dsonar.host.url=https://sonarcloud.io
          --file ./simpleapi/pom.xml

  build-and-push:
    # Ce job a besoin que 'test-backend' se termine avec succès avant de démarrer
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Étape de connexion à Docker Hub en utilisant les secrets
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Étape pour construire et pousser l'image de l'API
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./simpleapi  # Le chemin vers le Dockerfile de l'API
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops_tp-backend:latest
          # On ne pousse l'image que si le commit est sur la branche 'main'
          push: ${{ github.ref == 'refs/heads/main' }}

      # Étape pour construire et pousser l'image de la base de données
      - name: Build and push Database image
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops_tp-db:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # Étape pour construire et pousser l'image du serveur httpd
      - name: Build and push Httpd image
        uses: docker/build-push-action@v6
        with:
          context: ./httpd
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops_tp-httpd:latest
          push: ${{ github.ref == 'refs/heads/main' }}
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i ansible/inventories/setup.yml ansible/playbook.yml