name: CI DevOps 2025

# Les déclencheurs (triggers) : QUAND ce pipeline doit-il se lancer ?
on:
  # Se lance à chaque fois qu'un 'git push' est fait sur ces branches
  push:
    branches:
      - main

  # Se lance aussi à chaque fois qu'une Pull Request est ouverte ou mise à jour
  pull_request:

# La liste des "jobs" (tâches) à exécuter
jobs:
  # Le nom de notre premier job : tester le backend
  test-backend:
    # La machine virtuelle sur laquelle ce job va s'exécuter. Ubuntu est un choix standard.
    runs-on: ubuntu-24.04

    # La liste des étapes (steps) à exécuter séquentiellement
    steps:
      # Étape 1 : Récupérer le code de votre dépôt
      # 'uses' permet d'utiliser une "Action" pré-faite par la communauté.
      # 'actions/checkout@v4' est l'action officielle pour cloner votre code.
      - name: Checkout code
        uses: actions/checkout@v4

      # Étape 2 : Mettre en place l'environnement Java
      # 'actions/setup-java@v4' installe la version de Java que vous spécifiez.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin' # La distribution Adoptium/Temurin, très commune

      # Étape 3 : Lancer la commande Maven pour compiler et tester
      # 'run' permet d'exécuter une commande shell.
      # La commande 'mvn clean verify' va compiler le code, télécharger les dépendances,
      # et lancer les tests unitaires et d'intégration.
      - name: Build and test with Maven
        # On spécifie le chemin vers le pom.xml de l'API
        run: mvn -B clean verify --file ./simpleapi/pom.xml